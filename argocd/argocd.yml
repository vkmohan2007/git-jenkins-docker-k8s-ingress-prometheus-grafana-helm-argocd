apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: microsvc-app
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/vkmohan2007/git-jenkins-docker-k8s-ingress-prometheus-grafana-helm-argocd.git
    targetRevision: HEAD
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: microsvc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true

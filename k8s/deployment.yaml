apiVersion: apps/v1
kind: Deployment
metadata:
  name: microsvc-deployment
  namespace: default
  labels:
    app: microsvc
spec:
  replicas: 3
  selector:
    matchLabels:
      app: microsvc
  template:
    metadata:
      labels:
        app: microsvc
    spec:
      containers:
      - name: microsvc
        image: vkmohan2007/git-jenkins-docker-k8s-ingress-prometheus-grafana-helm-argocd-app:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "250m"
          limits:
            memory: "128Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: microsvc-service
  namespace: default
  labels:
    app: microsvc
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
  selector:
    app: microsvc
